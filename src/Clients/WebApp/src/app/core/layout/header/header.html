<header class="header">
  <div class="container topbar">
    <div class="logo" (click)="goHome()" role="button" tabindex="0">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="logo-svg">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      <span class="logo-text">e<span class="logo-highlight">Shop</span></span>
    </div>
    
    <form class="search-bar" (ngSubmit)="onSearch()">
      <input 
        type="text" 
        placeholder="Ne arıyorsunuz? (Örn: tişört, pantolon, kulaklık)" 
        [(ngModel)]="searchQuery" 
        name="searchQuery"
        autocomplete="off"
        id="header-search-input"
      />
      <button type="submit" class="search-btn" id="header-search-btn" aria-label="Ara">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
        </svg>
      </button>
    </form>
    
    <div class="user-actions">
      <button class="action-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Hesabım</span>
      </button>
      <button class="action-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        <span>Favorilerim</span>
      </button>
      <button class="action-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span>Sepetim</span>
      </button>
    </div>
  </div>
  
  <nav class="navbar">
    <div class="container">
      <ul class="nav-links">
        <li><a [routerLink]="['/products']">Tüm Ürünler</a></li>
        <li><a [routerLink]="['/products']" [queryParams]="{ category: 'Elektronik' }">Elektronik</a></li>
        <li><a [routerLink]="['/products']" [queryParams]="{ category: 'Giyim' }">Giyim & Moda</a></li>
        <li><a [routerLink]="['/products']" [queryParams]="{ category: 'Pantolon' }">Pantolon</a></li>
        <li><a [routerLink]="['/products']" [queryParams]="{ category: 'Spor' }">Spor</a></li>
        <li><a [routerLink]="['/products']" [queryParams]="{ category: 'Kitaplar' }">Kitaplar</a></li>
      </ul>
    </div>
  </nav>
</header>
